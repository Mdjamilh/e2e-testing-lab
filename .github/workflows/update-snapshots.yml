name: Update visual baselines

# Run by hand from the Actions tab after an intentional UI change. It renders
# the @visual tests inside the same container CI uses and uploads the new
# -linux PNGs as an artifact; download it and commit the files.
on:
  workflow_dispatch:

jobs:
  update:
    name: Regenerate -linux screenshots
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright test --grep @visual --update-snapshots --project=chromium
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/**/*-snapshots/*-linux.png
          retention-days: 7
